[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61.2" ]

[project]
name = "whispers"
description = "Whispers: offline transcription, speaker separation and voice comparison for investigative triage"
readme.content-type = "text/markdown"
readme.file = "README.md"
license = { text = "MIT" }
authors = [ { name = "silvance" } ]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [ "numpy" ]
optional-dependencies.dev = [ "mypy", "pytest", "ruff" ]
# GUI / CPU-optimized transcription extras for the Whispers desktop app.
# tkinter ships with CPython; faster-whisper (CTranslate2) is the CPU backend.
# python-docx (Word export), langdetect (auto source-language) and tkinterdnd2
# (file drag-and-drop) are small UX add-ons used when present.
# The caps say what the application supports. They are not what makes a bundle
# reproducible - packaging/lockfile.txt is, by pinning the exact version an
# operational build uses, and packaging/check_lock.py by failing a build that
# drifts from it. The manifest in whispers_assets/build_manifest.json records what
# a build was; the lock decides what it is allowed to be.
optional-dependencies.gui = [
  "faster-whisper>=1.2,<2",
  "ctranslate2>=4.8,<5",
  "onnxruntime>=1.17,<2",
  "sherpa-onnx>=1.13,<2",
  "ttkbootstrap>=1.10,<2",
  "python-docx>=1.1,<2",
  "langdetect>=1.0,<2",
  "tkinterdnd2>=0.4,<0.5",
]
# Build-time tooling for producing offline, air-gapped PyInstaller bundles.
# huggingface-hub <1.0: pyannote 3.1.1 forwards the use_auth_token kwarg (removed
# in huggingface_hub 1.0) into hf_hub_download.
optional-dependencies.bundle = [ "pyinstaller>=6.22,<7", "imageio-ffmpeg>=0.5,<1", "huggingface-hub<1.0" ]
# High-accuracy diarization backend (PyTorch-based; gated HF models). Preferred
# over sherpa-onnx for hard/low-quality audio when installed. Pinned to 3.1.1:
# newer releases require torchcodec, the gated community-1 PLDA, and add inference
# telemetry - none of which suit an offline, air-gapped build. numpy<2 because
# 3.1.1 uses np.NaN, which NumPy 2.0 removed.
optional-dependencies.pyannote = [ "pyannote.audio==3.1.1", "soundfile", "numpy<2" ]
# Offline text translation backend (CTranslate2-based, CPU). Language packs are
# bundled into the air-gapped build; see whispers.resources.configure_offline_translation.
optional-dependencies.translate = [ "argostranslate>=1.9,<2" ]
# Offline OCR for the translation workflow (image/PDF -> text). pytesseract drives
# a bundled Tesseract binary; pypdfium2 + Pillow handle PDFs and images.
optional-dependencies.ocr = [ "pytesseract>=0.3.10,<0.4", "pypdfium2>=4,<5", "pillow>=10,<12" ]
scripts.whispers = "whispers.app:main"

[tool.setuptools.dynamic]
version = { attr = "whispers.version.__version__" }

[tool.setuptools.packages.find]
include = [ "whispers*" ]
namespaces = false

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = [ "E", "F", "I", "W" ]
# E203 (whitespace before punctuation) conflicts with the formatter;
# E501 (line length) is enforced by the formatter instead.
ignore = [ "E203", "E501" ]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [ "F401" ]

[tool.ruff.lint.isort]
known-first-party = [ "whispers" ]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
