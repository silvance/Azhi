name: release-bundles

# Builds self-contained, offline Azhí bundles for Windows and Linux.
# Each bundle includes the Python runtime, all dependencies, an ffmpeg binary, and
# the selected Whisper models, so it can be copied to an air-gapped machine and run
# with no network access. The build runners use the internet; the targets do not.
#
# For fast iteration, "Run workflow" defaults to a single model (base.en) on both
# OSes; set platform=windows (or linux) for the quickest test build.
#
# To publish a downloadable GitHub Release: "Run workflow" with a release_tag
# (e.g. v1.0.0). The built bundle for each OS is archived and attached to a public
# Release at that tag, so anyone can download it from the repo's Releases page.
# Pushing a bundle-v* tag does the same using that tag. NOTE: a GitHub release
# asset is capped at ~2 GB, so keep each bundle under that for a public release
# (e.g. models=base.en, diarizer=sherpa, empty translate_langs/ocr_langs) - the
# full multi-GB bundle won't upload as a single asset.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which OS to build (use one for faster test iteration)"
        type: choice
        options: [both, linux, windows]
        default: both
      models:
        description: "Comma-separated models to bundle: tiny, base, small, medium, large-v3, turbo, and the .en variants of tiny/base/small/medium (e.g. base.en,small,turbo). The application starts on medium, so a bundle without it falls back to whatever it does carry. turbo and large-v3 are ~1.6 GB each; medium is ~1.5 GB."
        default: "base.en,medium"
      diarizer:
        description: "Diarization backend to bundle (both = pyannote + sherpa, selectable at runtime; pyannote = best on hard audio; sherpa = smallest)"
        type: choice
        options: [both, pyannote, sherpa]
        default: both
      nemotron:
        description: "Bundle NVIDIA Nemotron 3 Diarization (+ NeMo-Speech.cpp runtime, ~125 MB), the default speaker-separation Method where included. The model is licensed OpenMDW-1.1 (permissive); its text and NVIDIA's model card ship beside it, as the licence asks."
        type: choice
        options: ["yes", "no"]
        default: "yes"
      alignment:
        description: "Also bundle the English word-timing model (wav2vec2-base-960h, Apache-2.0, ~380 MB) as a trial: it re-times English words before they are given to speakers, so one-word replies land on the right person more often."
        type: choice
        options: ["no", "yes"]
        default: "no"
      embedding:
        description: "Speaker-embedding model for speaker profiles/comparison. titanet-large (default) and titanet-small: NeMo TitaNet, English corpora. wespeaker-en: ResNet34, VoxCeleb (mostly English). campplus/eres2net: 3D-Speaker zh-cn 16k-common, Mandarin-trained. A direct .onnx URL also works."
        default: "titanet-large"
      translate_langs:
        description: "Argos text-translation packs to bundle (<code>->en, comma-separated; empty to skip translation)"
        default: "ar,ru,zh,fa,uk,he,ko"
      ocr_langs:
        description: "Tesseract OCR language packs to bundle (image/PDF -> text; comma-separated; empty to skip OCR)"
        default: "ar,ru,zh,fa,uk,he,ko"
      release_tag:
        description: "Publish a downloadable GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build artifacts. Keep the bundle under ~2 GB per OS (a release asset is capped at 2 GB) - e.g. models=base.en, diarizer=sherpa, empty translate/ocr."
        default: ""
  push:
    tags:
      - "bundle-v*"

jobs:
  # Build the job matrix from the platform input so test runs can target one OS.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        run: |
          linux='{"os":"ubuntu-latest","artifact":"azhi-linux-x86_64"}'
          windows='{"os":"windows-latest","artifact":"azhi-windows-x86_64"}'
          case "${{ github.event.inputs.platform || 'both' }}" in
            linux) include="[$linux]" ;;
            windows) include="[$windows]" ;;
            *) include="[$linux,$windows]" ;;
          esac
          echo "value={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    # Allow this job to create/update a GitHub Release and upload assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # both = bundle pyannote + sherpa (selectable at runtime); push/tag builds
      # have no inputs, so they get both. "!= 'sherpa'" means pyannote-or-both;
      # "!= 'pyannote'" means sherpa-or-both.
      DIARIZER: ${{ github.event.inputs.diarizer || 'both' }}
      # End-to-end diarizer, Auto's first choice where bundled; tag builds have
      # no inputs, so they carry it too. Licence: OpenMDW-1.1 (see notices).
      NEMOTRON: ${{ github.event.inputs.nemotron || 'yes' }}
      # Trial English word re-timing (~380 MB); tag builds leave it out.
      ALIGNMENT: ${{ github.event.inputs.alignment || 'no' }}
      # Speaker-embedding model for speaker profiles + comparison (and sherpa
      # diarization). Bundled on every build. Default TitaNet-large, trained on
      # English corpora; campplus / eres2net are the 3D-Speaker zh-cn 16k-common
      # (Mandarin) checkpoints. Verification performance varies with language,
      # channel, noise and duration - see packaging/fetch_assets.py.
      EMBEDDING: ${{ github.event.inputs.embedding || 'titanet-large' }}
      # Argos text-translation packs (<code>->en). Empty string skips translation.
      TRANSLATE_LANGS: ${{ github.event.inputs.translate_langs || 'ar,ru,zh,fa,uk,he,ko' }}
      # Tesseract OCR language packs (image/PDF -> text). Empty string skips OCR.
      OCR_LANGS: ${{ github.event.inputs.ocr_langs || 'ar,ru,zh,fa,uk,he,ko' }}
    steps:
      - name: Resolve release tag
        id: rel
        shell: bash
        # Publish a Release when a release_tag input is given (manual run) or when
        # a bundle-v* tag was pushed. Empty = build artifacts only, no release.
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # Always-present GUI runtime stack + build tools. faster-whisper/
          # ctranslate2 do the transcription; sherpa-onnx is the fallback diarizer.
          # The ranges say what the application supports; packaging/lockfile.txt
          # says which version this bundle actually gets, so the copy that was
          # field-tested and a rebuild of the same commit are the same software.
          # Changing a pinned version is a deliberate act on a branch - see
          # packaging/check_lock.py - never something a rebuild does by itself.
          # Keep each pip install on ONE line: this step has no `shell:`, so it
          # runs under PowerShell on the Windows runner, where a trailing "\" is
          # not a line continuation and the next line is parsed as a new
          # statement beginning with a string.
          pip install -c packaging/lockfile.txt "faster-whisper>=1.2,<2" "ctranslate2>=4.8,<5" "onnxruntime>=1.17,<2" "sherpa-onnx>=1.13,<2" "ttkbootstrap>=1.10,<2"
          # huggingface_hub <1.0: pyannote 3.1.1 forwards the (removed-in-1.0)
          # use_auth_token kwarg into hf_hub_download; 0.x still accepts it.
          pip install -c packaging/lockfile.txt "pyinstaller>=6.22,<7" "imageio-ffmpeg>=0.5,<1" "huggingface_hub<1.0"
          # Small UX add-ons bundled when present: Word export, source-language
          # auto-detect, and file drag-and-drop.
          pip install -c packaging/lockfile.txt "python-docx>=1.1,<2" "langdetect>=1.0,<2" "tkinterdnd2>=0.4,<0.5"
      - name: Install pyannote diarizer (CPU PyTorch)
        if: env.DIARIZER != 'sherpa'
        # Install CPU-only torch from PyTorch's CPU index FIRST so pyannote.audio
        # finds it already satisfied and never pulls the ~3.5 GB CUDA wheels.
        # Versions are pinned: pyannote.audio 3.1.1 (the canonical build for the
        # speaker-diarization-3.1 pipeline) loads audio via torchaudio+soundfile
        # and has no telemetry, unlike newer releases that require torchcodec, the
        # gated community-1 PLDA, and add a phone-home call in the inference path -
        # none of which suit an offline, air-gapped build. torch/torchaudio 2.2.2
        # are the matching versions whose torchaudio backend pyannote 3.1.1 uses.
        # numpy is pinned <2 because pyannote 3.1.1 uses np.NaN, removed in NumPy 2.
        run: |
          pip install -c packaging/lockfile.txt torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -c packaging/lockfile.txt "pyannote.audio==3.1.1" soundfile "numpy<2"
      - name: Install translation engine (Argos Translate)
        if: env.TRANSLATE_LANGS != ''
        # numpy<2 keeps a single numpy across the bundle (matches the pyannote pin
        # and stanza's expectations).
        run: pip install -c packaging/lockfile.txt "argostranslate>=1.9,<2" "numpy<2"
      - name: Install Tesseract OCR engine (Linux)
        if: env.OCR_LANGS != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract OCR engine (Windows)
        if: env.OCR_LANGS != '' && runner.os == 'Windows'
        # choco ships on windows-latest; tesseract.exe lands on PATH.
        run: choco install --no-progress -y tesseract
      - name: Install OCR Python deps
        if: env.OCR_LANGS != ''
        run: pip install -c packaging/lockfile.txt pytesseract pypdfium2 pillow "numpy<2"
      - name: Install the Azhí package
        # --no-deps: everything it needs was installed above, pinned by the
        # lockfile; pip resolving again could only move a version.
        run: pip install --no-deps .
      # Everything is installed by now, including the optional engines this build
      # selected. A version that drifted from the lock means the bundle would not
      # be the software that was tested, so it fails here rather than shipping.
      - name: Check the dependency lock
        run: python packaging/check_lock.py
      # Everything this build resolved, including the parts the lock does not
      # name yet - pyannote 3.1.1 brings its own tree, and that tree can move
      # under a rebuild exactly as anything else can. Extend the lock from this
      # on a branch with:
      #   python packaging/check_lock.py --write --from-freeze pip-freeze.txt --add-all
      - name: Record everything this build installed
        run: python -m pip freeze > pip-freeze.txt
      - name: Fetch ffmpeg
        run: python packaging/fetch_assets.py ffmpeg
      - name: Fetch models
        run: python packaging/fetch_assets.py models ${{ github.event.inputs.models || 'base.en,medium' }}
      - name: Fetch speaker embedding model (voiceprints + comparison)
        run: python packaging/fetch_assets.py embedding ${{ env.EMBEDDING }}
      - name: Fetch noise-reduction model
        run: python packaging/fetch_assets.py enhancement
      - name: Fetch diarization segmentation model (sherpa-onnx)
        if: env.DIARIZER != 'pyannote'
        run: python packaging/fetch_assets.py segmentation
      - name: Fetch diarization models (pyannote, gated)
        if: env.DIARIZER != 'sherpa'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python packaging/fetch_assets.py pyannote
      - name: Fetch Nemotron diarization (trial; NeMo-Speech.cpp runtime + model)
        if: env.NEMOTRON == 'yes'
        run: python packaging/fetch_assets.py nemotron
      - name: Fetch English word-timing model (trial; wav2vec2-base-960h ONNX)
        if: env.ALIGNMENT == 'yes'
        run: python packaging/fetch_assets.py alignment
      - name: Fetch translation packs (Argos) + warm offline splitter
        if: env.TRANSLATE_LANGS != ''
        run: python packaging/fetch_assets.py argos ${{ env.TRANSLATE_LANGS }}
      - name: Fetch OCR engine (Tesseract binary + language data)
        if: env.OCR_LANGS != ''
        run: python packaging/fetch_assets.py tesseract ${{ env.OCR_LANGS }}
      # Record what went into this bundle (commit, dependency versions, and a
      # SHA-256 for every bundled model) so the shipped app can state its own
      # identity and a result can be traced back to a specific build.
      - name: Write build manifest
        run: >-
          python packaging/build_manifest.py
          --build-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --commit "${{ github.sha }}"
      - name: Build bundle
        run: pyinstaller --noconfirm packaging/azhi.spec
      # The guide has to travel with the tool. An air-gapped machine cannot be
      # sent a link, so a bundle that ships without it leaves the operator with
      # an executable and nothing to read. Copied in before the inventory so it
      # is covered by `Azhi --verify` like everything else that shipped.
      - name: Include the user guide
        shell: bash
        run: cp docs/user-guide.md "dist/Azhi/USER-GUIDE.md"
      # The licence and every notice the bundled software and models require,
      # beside the program, before the inventory so --verify covers them.
      - name: Ship the licence and third-party notices
        shell: bash
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/Azhi/
          python packaging/collect_licences.py dist/Azhi
      # Record what this build shipped, so the copy that reaches an air-gapped
      # machine can be checked against it with `Azhi --verify`. A bundle is
      # thousands of files carried on removable media; when one goes missing the
      # application fails at whichever piece it reaches first, which is a
      # different piece on different runs and tells the operator nothing.
      - name: Record bundle inventory
        run: python packaging/write_inventory.py dist/Azhi
      # Prove the executable actually starts before shipping it. PyInstaller
      # exiting 0 only means it wrote a directory; a bundle missing one stdlib
      # extension builds cleanly and then dies on the operator's desktop with a
      # traceback from a runtime hook, before any of our code runs. --self-test
      # goes through that same startup and prints what this build can do.
      - name: Verify the bundle starts (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/Azhi/Azhi --self-test
          ./dist/Azhi/Azhi --verify
      - name: Verify the bundle starts (Windows)
        if: runner.os == 'Windows'
        run: |
          & .\dist\Azhi\Azhi.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\Azhi\Azhi.exe --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/Azhi
          if-no-files-found: error
          retention-days: 14
      # The weights this build resolved. When packaging/assets.lock.json was
      # empty (the first build after a freeze), this is the file to commit: from
      # then on every build fetches exactly these revisions, and one that cannot
      # fails instead of quietly shipping different weights.
      - name: Upload the asset lock this build resolved
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-assets-lock
          path: |
            packaging/assets.lock.json
            pip-freeze.txt
          if-no-files-found: warn
          retention-days: 14

      # --- Publish a downloadable GitHub Release (only when a tag is resolved) ---
      - name: Package bundle (Linux)
        if: steps.rel.outputs.tag != '' && runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist Azhi
      - name: Package bundle (Windows)
        if: steps.rel.outputs.tag != '' && runner.os == 'Windows'
        run: Compress-Archive -Path dist/Azhi -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Publish to GitHub Release
        if: steps.rel.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The two OS jobs run in parallel: the first creates the release (and
        # uploads its asset); the second's create fails harmlessly, so it falls
        # back to uploading its asset to the existing release.
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          FILE=$(ls ${{ matrix.artifact }}.* | head -n1)
          NOTES="Offline Azhí desktop bundle. Download the archive for your OS, unzip, and run Azhi (Azhi.exe on Windows) - no installation or network needed. Check the copy you extracted before relying on it: run \`./Azhi --verify\` (\`Azhi.exe --verify\` on Windows) from a terminal. It compares every file against what this build shipped and names anything missing or altered - a copy damaged in transit is the usual cause of a startup error, and it can fail in a different place on each run. \`--self-test\` then prints what this copy can do, as does the in-app **System status** button."
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "Azhí $TAG" --notes "$NOTES" "$FILE" \
          || gh release upload "$TAG" "$FILE" --clobber --repo "${{ github.repository }}"
